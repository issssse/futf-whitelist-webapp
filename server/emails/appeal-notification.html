<table role="presentation" cellpadding="0" cellspacing="0" width="100%"
       style="background-color:#f4f5fb;padding:32px 0;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" width="600"
             style="width:100%;max-width:600px;background-color:#ffffff;border-radius:18px;border:1px solid #e5e7eb;box-shadow:0 18px 45px rgba(15,23,42,0.12);color:#0f172a;">
        <tr>
          <td style="padding:18px 24px;border-bottom:1px solid #e5e7eb;background-image:linear-gradient(135deg,#2563eb,#10b981);">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="vertical-align:middle;">
                  <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="padding-right:12px;">
                        <img src="{{LOGO_URL}}" alt="{{APP_NAME}}" width="36" height="36" style="display:block;border-radius:6px;border:1px solid rgba(255,255,255,0.35);">
                      </td>
                      <td style="font-size:14px;line-height:1.4;color:#f8fafc;">
                        <div style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#fef3c7;font-weight:700;">{{APP_NAME}}</div>
                        <div style="font-size:14px;font-weight:600;color:#ffffff;">New whitelist request</div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 28px 26px;font-size:14px;line-height:1.6;">
            <h2 style="margin:0 0 12px;font-size:18px;color:#0f172a;">Request details</h2>
            <p style="margin:0 0 8px;">
              <strong>Server:</strong> {{SERVER_NAME}}<br>
              <strong>Email:</strong> {{USER_EMAIL}}<br>
              <strong>Minecraft:</strong> {{MINECRAFT_NAME}}<br>
              <strong>Name:</strong> {{REAL_NAME}}<br>
              <strong>Reason:</strong> {{REASON}}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
