<table role="presentation" cellpadding="0" cellspacing="0" width="100%"
       style="background-color:#f4f5fb;padding:32px 0;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" width="420"
             style="width:100%;max-width:420px;background-color:#ffffff;border-radius:16px;border:1px solid #e5e7eb;box-shadow:0 18px 45px rgba(15,23,42,0.12);color:#0f172a;">
        <tr>
          <td style="padding:18px 24px;border-bottom:1px solid #e5e7eb;background-image:linear-gradient(135deg,#2563eb,#10b981);text-align:center;">
            <img src="{{LOGO_URL}}" alt="{{APP_NAME}}" width="32" height="32" style="display:block;margin:0 auto 6px;border-radius:6px;border:1px solid rgba(255,255,255,0.35);">
            <div style="font-size:12px;letter-spacing:0.14em;color:#fef3c7;text-transform:uppercase;font-weight:700;">{{APP_NAME}}</div>
            <div style="font-size:16px;font-weight:700;color:#f9fafb;margin-top:4px;">Email verification code</div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px;text-align:center;font-size:14px;line-height:1.6;">
            <p style="margin:0 0 10px;color:#4b5563;">Use this code to verify your email. It expires in 10 minutes.</p>
            <div style="font-size:28px;font-weight:800;letter-spacing:10px;color:#0f172a;background-color:#f8fafc;border:1px solid #e5e7eb;padding:14px 12px;border-radius:12px;">{{CODE}}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
