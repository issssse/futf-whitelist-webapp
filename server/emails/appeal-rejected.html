<table role="presentation" cellpadding="0" cellspacing="0" width="100%"
       style="background-color:#f4f5fb;padding:32px 0;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" width="600"
             style="width:100%;max-width:600px;background-color:#ffffff;border-radius:18px;border:1px solid #e5e7eb;box-shadow:0 18px 45px rgba(15,23,42,0.12);color:#0f172a;">
        <tr>
          <td style="padding:18px 24px;border-bottom:1px solid #e5e7eb;background-image:linear-gradient(135deg,#f97316,#dc2626);">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="vertical-align:middle;">
                  <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="padding-right:12px;">
                        <img src="{{LOGO_URL}}" alt="{{APP_NAME}}" width="36" height="36" style="display:block;border-radius:6px;border:1px solid rgba(255,255,255,0.35);">
                      </td>
                      <td style="font-size:14px;line-height:1.4;color:#f8fafc;">
                        <div style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#fef3c7;font-weight:700;">{{APP_NAME}}</div>
                        <div style="font-size:14px;font-weight:600;color:#ffffff;">Whitelist update</div>
                      </td>
                    </tr>
                  </table>
                </td>
                <td align="right" style="font-size:12px;color:#fef2f2;white-space:nowrap;">
                  <span style="display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,0.4);background-color:rgba(0,0,0,0.15);">Rejected</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 8px;">
            <h1 style="margin:0;font-size:24px;line-height:1.3;font-weight:800;color:#0f172a;">Your request was rejected</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 24px;line-height:1.6;font-size:14px;">
            <p style="margin:0 0 12px;color:#1f2937;">Hi {{USER_NAME}},</p>
            <p style="margin:0 0 12px;color:#1f2937;">Your whitelist request for <strong>{{SERVER_NAME}}</strong> (Minecraft: <strong>{{MINECRAFT_NAME}}</strong>) was not approved.</p>
            <p style="margin:0 0 16px;color:#1f2937;">If you think this is a mistake or want to provide more info, please contact an admin.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 22px;border-top:1px solid #e5e7eb;background-color:#f8fafc;font-size:12px;color:#4b5563;text-align:center;">
            Questions? Reply to this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
